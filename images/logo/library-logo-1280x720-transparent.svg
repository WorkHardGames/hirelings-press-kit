<!--
  HIRELINGS - library logo / master wordmark - 1280 x 720 - TRANSPARENT

  This is the one asset to get right. It is Steam's library logo, AND the
  trailer end card, AND the main menu logo, AND your press kit logo. Draw
  it once and reuse it - if the trailer logo and the store logo differ,
  nobody connects the two.

  There is deliberately NO background layer. Steam requires transparency.
  Before exporting, check File > Document Properties and set the page
  background alpha to 0, or Inkscape bakes white behind it.

  LAYERS:  1 Wordmark  - the word and nothing else.

  Deliberately no tagline and no call to action. This same file is the
  library logo, the main menu logo and the press-kit logo, where a CTA
  would be wrong - and Valve rejects marketing text inside capsule assets.
  Add "WISHLIST NOW" as a separate text layer in Resolve for the trailer
  end card only.
  Flat white, no outline, no shadow. The outline was removed deliberately:
  it only exists to separate type from busy art, and this sits on clean
  ground. Decoration on type is the classic amateur tell, and a thick stroke
  closes up the counters when the mark is shrunk.

  NOTE: this file is transparent and the text is WHITE, so on Inkscape's
  white canvas it looks blank. Drop a temporary red rectangle behind it to
  judge it, then delete that before exporting.

  EXPORT: File > Export... > width 1280, height 720, PNG.
-->

